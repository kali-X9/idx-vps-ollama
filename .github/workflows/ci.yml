name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install format/lint tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt
      - name: Format (shfmt)
        run: shfmt -w -i 2 vm.sh vps.sh tools/ollama-install.sh || true
      - name: Shellcheck
        run: shellcheck -x vm.sh vps.sh tools/ollama-install.sh

  smoke:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check (non-destructive)
        run: |
          bash -n vm.sh
          bash -n vps.sh
          bash -n tools/ollama-install.sh
